<!DOCTYPE html>

<body>
  <!--
    Icon sprite. Inline SVG rather than emoji or an icon font: emoji render as
    full-colour Apple art on macOS, flat Microsoft art on Windows and Noto on
    Android, so the same nav can never look deliberate everywhere. These are one
    stroke weight on a 24px grid, tinted by `currentColor`, and cost no request.
    Referenced as <svg class="icon"><use href="#i-name"/></svg>.
  -->

      <symbol id="i-dashboard" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
