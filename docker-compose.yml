# AscendPlatform — production stack (Ubuntu VPS, no Hestia, no certbot).
#
#   cp .env.example .env    # then set POSTGRES_PASSWORD, ADMIN_DOMAIN, keys
#   docker compose up -d --build
#
# Caddy terminates TLS automatically; the app runs migrations on start.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ascendplatform}
      POSTGRES_USER: ${POSTGRES_USER:-ascendplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ascendplatform} -d ${POSTGRES_DB:-ascendplatform}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ascendplatform}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ascendplatform}
      REDIS_URL: redis://redis:6379/0
      JOB_BACKEND: ${JOB_BACKEND:-redis}
      HOST: 0.0.0.0
      PORT: "8000"
      SERVER_IP: ${SERVER_IP:-}
      # Which build is being served. deploy.sh exports these before recreating the
      # container, so /api/version names the commit actually running.
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      APP_VERSION: ${APP_VERSION:-unknown}
      SITE_ROOT: /srv/sites
      CADDY_SITES_DIR: /etc/caddy/sites
      CADDYFILE: /app/Caddyfile
      # Reload Caddy through its admin API (no caddy binary in this image).
      CADDY_RELOAD_CMD: "${CADDY_RELOAD_CMD:-curl -fsS -X POST -H 'Content-Type: text/caddyfile' --data-binary @/app/Caddyfile http://caddy:2019/load}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data
      - ./artifacts:/app/artifacts
      # The console is static files served from disk, so mount it rather than baking it in:
      # a CSS or JS fix then ships with a pull and a refresh instead of a 10-minute rebuild.
      - ./admin:/app/admin:ro
      - ./Caddyfile:/app/Caddyfile:ro
      - ./sites:/srv/sites
      - ./sites-conf:/etc/caddy/sites
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn asgi:app --host 0.0.0.0 --port 8000 --workers 2"
    restart: unless-stopped

  # Agent jobs run here when JOB_BACKEND=redis, so long AutoGen runs survive app
  # restarts and scale independently of the web process.
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ascendplatform}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ascendplatform}
      REDIS_URL: redis://redis:6379/0
      JOB_BACKEND: redis
      # Provisioning runs *here*, not in the web process, so the worker needs the same
      # site paths as app: otherwise the vhost and the content are written into this
      # container's own filesystem, Caddy never sees them, and the site silently never
      # goes live. Keep these in step with the `app` service.
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      APP_VERSION: ${APP_VERSION:-unknown}
      SERVER_IP: ${SERVER_IP:-}
      SITE_ROOT: /srv/sites
      CADDY_SITES_DIR: /etc/caddy/sites
      CADDYFILE: /app/Caddyfile
      CADDY_RELOAD_CMD: "${CADDY_RELOAD_CMD:-curl -fsS -X POST -H 'Content-Type: text/caddyfile' --data-binary @/app/Caddyfile http://caddy:2019/load}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      # app is the service that runs `alembic upgrade head` before serving, so waiting for
      # its healthcheck means the worker cannot pick up a job against a half-migrated
      # schema. Without this the worker is healthy seconds before the tables exist.
      app:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/artifacts
      # The three the provisioner writes through: the vhost Caddy imports, the document
      # root Caddy serves, and the Caddyfile the reload posts.
      - ./Caddyfile:/app/Caddyfile:ro
      - ./sites:/srv/sites
      - ./sites-conf:/etc/caddy/sites
    command: ["python", "-m", "worker"]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./sites-conf:/etc/caddy/sites:ro
      - ./sites:/srv/sites:ro
    depends_on:
      - app
    restart: unless-stopped

  # Optional LiteLLM gateway (stage S4): one OpenAI-compatible endpoint for every
  # provider, with spend tracking, retries and fallbacks.
  #
  #   docker compose --profile gateway up -d litellm
  #   # then set LLM_GATEWAY_URL=http://litellm:4000 in .env
  #
  # Only started with the "gateway" profile, so the default stack is unchanged.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["gateway"]
    env_file: .env
    environment:
      LLM_GATEWAY_KEY: ${LLM_GATEWAY_KEY:-sk-ascendplatform}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

volumes:
  db_data:
  caddy_data:
  caddy_config:
  app_data:
