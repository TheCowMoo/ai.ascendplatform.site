<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chatbot Widget Preview</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .card { background: #fff; border-radius: 14px; padding: 36px; max-width: 540px; text-align: center; box-shadow: 0 12px 32px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 15px; line-height: 1.6; }
    code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Chatbot Widget Preview</h1>
    <p>Add <code>?bot=YOUR_BOT_ID</code> to this URL to preview a specific bot's widget,<br/>or grab the embed snippet from the <b>AscendPlatform</b> dashboard.</p>
  </main>
  <script>
    (function () {
      var id = new URLSearchParams(window.location.search).get('bot');
      if (id) {
        var s = document.createElement('script');
        s.src = '/widget.js';
        s.setAttribute('data-bot', id);
        document.body.appendChild(s);
      }
    })();
  </script>
</body>
</html>
