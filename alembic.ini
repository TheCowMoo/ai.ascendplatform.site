# Alembic configuration for CMBGrowthAI.
#
# The database URL comes from the DATABASE_URL environment variable (see
# alembic/env.py) so migrations always target the same database as the app.
#
#   alembic upgrade head         # apply migrations
#   alembic current              # show the applied revision
#   alembic revision -m "..."    # create a new migration

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S